<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#86385f">
<meta name="description" content="Apprendre le poker (Texas Hold'em) pas à pas : cartes, combinaisons, positions, déroulement d'une main, lecture du board, outs et calculs, avec exercices corrigés.">
<title>Apprendre le poker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icones/icone-192.png">
<link rel="apple-touch-icon" href="icones/icone-192.png">
<style>
:root {
  --bg: #f3e9ee; --bg2: #ead9e2; --blanc: #fff; --rose: #c27a9b; --prune: #86385f; --prune-f: #5c2343;
  --lavande: #b7a2c8; --lav-c: #ede4f3; --menthe: #bfe0d2; --vert: #3f8f6e; --peche: #f0d0b8;
  --texte: #3a2840; --doux: #82708a; --rouge: #b3264f; --rouge-c: #f0c2d0; --or: #c4a15a;
  --ombre: 0 3px 10px rgba(90, 40, 70, .14); --ombre-f: 0 6px 18px rgba(90, 40, 70, .22);
  --tapis: #6a4570; --tapis-b: #3e2743;
  --serif: Georgia, "Noto Serif", "Times New Roman", serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--sans); color: var(--texte); min-height: 100vh;
  background: radial-gradient(120% 60% at 50% 0%, #fbf4f7 0%, var(--bg) 55%, var(--bg2) 100%) fixed;
  -webkit-user-select: none; user-select: none; overscroll-behavior-y: none;
}
button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; }
a { color: inherit; }
#app { max-width: 560px; margin: 0 auto; padding-bottom: 40px; }

/* ---------- barre du haut ---------- */
.barre {
  position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 10px;
  padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
  background: linear-gradient(135deg, var(--prune-f), var(--prune) 60%, #a14f78);
  color: #fff; box-shadow: 0 2px 12px rgba(60, 20, 45, .3);
}
.barre h1 { flex: 1; margin: 0; font: italic 600 1.15rem var(--serif); letter-spacing: .3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.barre .rond { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 1.2rem; background: rgba(255,255,255,.14); color: #fff; }
.barre .rond:active { background: rgba(255,255,255,.28); }
.filet { height: 2px; background: linear-gradient(90deg, transparent, var(--or), transparent); }

/* ---------- accueil ---------- */
.hero { text-align: center; padding: 26px 18px 8px; }
.hero .eventail { height: 120px; display: flex; justify-content: center; align-items: flex-end; margin-bottom: 8px; }
.hero .eventail svg { width: 70px; margin: 0 -10px; filter: drop-shadow(0 6px 10px rgba(90,40,70,.25)); }
.hero .eventail svg:nth-child(1) { transform: rotate(-14deg) translateY(10px); }
.hero .eventail svg:nth-child(2) { transform: translateY(-4px); z-index: 1; }
.hero .eventail svg:nth-child(3) { transform: rotate(14deg) translateY(10px); }
.hero h2 { font: italic 600 1.9rem var(--serif); color: var(--prune); margin: 6px 0 2px; }
.hero p { margin: 0; color: var(--doux); font-style: italic; font-family: var(--serif); }
.ornement { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 10px auto; color: var(--or); }
.ornement::before, .ornement::after { content: ""; width: 70px; height: 1px; background: var(--or); }

.lecons { padding: 6px 14px; display: grid; gap: 12px; }
.lecon {
  display: flex; align-items: center; gap: 14px; text-align: left; width: 100%;
  padding: 14px; border-radius: 20px; background: var(--blanc); box-shadow: var(--ombre); border: 1px solid #ecdbe4;
}
.lecon:active { transform: scale(.985); }
.lecon .num {
  flex: none; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center;
  font: 700 1.2rem var(--serif); color: #fff; background: linear-gradient(135deg, var(--rose), var(--prune));
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.35), 0 0 0 2px var(--or);
}
.lecon .txt { flex: 1; min-width: 0; }
.lecon .txt b { display: block; font: 700 1.02rem var(--serif); color: var(--prune); }
.lecon .txt span { display: block; font-size: .85rem; color: var(--doux); margin-top: 2px; }
.lecon .etoiles { font-size: .8rem; color: var(--or); margin-top: 4px; letter-spacing: 1px; }
.lecon .fleche { color: var(--rose); font-size: 1.3rem; }

.promo {
  margin: 18px 14px 4px; padding: 18px; border-radius: 22px; color: #fff; position: relative; overflow: hidden;
  background: linear-gradient(135deg, var(--prune-f), var(--prune) 55%, var(--rose)); box-shadow: var(--ombre-f);
}
.promo::after { content: "♠ ♥ ♣ ♦"; position: absolute; right: -6px; bottom: -14px; font-size: 3.4rem; opacity: .12; letter-spacing: -6px; }
.promo h3 { margin: 0 0 6px; font: italic 600 1.2rem var(--serif); }
.promo p { margin: 0 0 12px; font-size: .9rem; opacity: .92; line-height: 1.4; }
.promo a { display: inline-block; padding: 10px 18px; border-radius: 30px; background: #fff; color: var(--prune); font-weight: 700; text-decoration: none; box-shadow: 0 0 0 2px var(--or); }
.pied { text-align: center; color: var(--doux); font-size: .8rem; margin: 18px 0 0; }
.pied button { text-decoration: underline; color: var(--doux); font-size: .8rem; }

/* ---------- onglets ---------- */
.onglets { display: flex; gap: 6px; padding: 12px 14px 4px; position: sticky; top: calc(58px + env(safe-area-inset-top)); z-index: 5; background: linear-gradient(var(--bg) 70%, transparent); }
.onglets button {
  flex: 1; padding: 10px 6px; border-radius: 30px; font-weight: 700; font-size: .88rem; color: var(--prune);
  background: var(--blanc); box-shadow: var(--ombre); border: 1px solid #e6d3de;
}
.onglets button.actif { background: linear-gradient(135deg, var(--rose), var(--prune)); color: #fff; border-color: var(--prune); }
.contenu { padding: 8px 14px; }

/* ---------- blocs ---------- */
.bloc { background: var(--blanc); border-radius: 22px; padding: 16px; box-shadow: var(--ombre); margin: 12px 0; border: 1px solid #ecdbe4; }
.bloc h3 { margin: 0 0 8px; font: 700 1.25rem var(--serif); color: var(--prune); }
.bloc p { margin: 6px 0; line-height: 1.45; font-size: .95rem; }
.savoir { background: var(--lav-c); border: 1px solid var(--lavande); }
.savoir h4 { margin: 0 0 8px; font: italic 700 1.05rem var(--serif); color: var(--prune); }
.savoir ul { margin: 0; padding-left: 18px; }
.savoir li { margin: 6px 0; line-height: 1.4; font-size: .9rem; }
.savoir li::marker { color: var(--prune); }
.indice { color: var(--doux); font-style: italic; font-size: .85rem; text-align: center; margin: 8px 0; }
.titre-sec { font: 700 1.05rem var(--serif); color: var(--prune); margin: 18px 2px 6px; }
.etiquette { display: inline-block; padding: 4px 12px; border-radius: 20px; font-weight: 700; font-size: .8rem; }
.menthe { background: var(--menthe); } .peche { background: var(--peche); } .rose { background: #ecc0d3; } .lavande { background: #ddd0ea; } .rouge { background: var(--rouge-c); }

/* ---------- puces / pastilles ---------- */
.puces { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 8px 0; }
.puce { padding: 8px 14px; border-radius: 30px; background: var(--blanc); border: 1.5px solid var(--lavande); font-weight: 700; font-size: .88rem; box-shadow: var(--ombre); }
.puce.actif { background: var(--rose); border-color: var(--prune); color: #fff; }
.puce.rouge-t { color: var(--rouge); } .puce.noir-t { color: #2e2238; }
.puce.actif.rouge-t, .puce.actif.noir-t { color: #fff; }

/* ---------- cartes ---------- */
svg.carte { display: block; width: 100%; height: auto; filter: drop-shadow(0 2px 3px rgba(80,40,70,.22)); overflow: visible; }
.grille-cartes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px 8px; }
.cellule { text-align: center; }
.cellule .f { font-size: .7rem; color: var(--doux); margin-top: 3px; }
.cellule.choisie svg { transform: translateY(-5px); }
.cellule svg { transition: transform .15s; }
.detail-carte { display: flex; gap: 14px; align-items: flex-start; }
.detail-carte .grande { width: 104px; flex: none; }
.detail-carte .infos { flex: 1; min-width: 0; }
.ligne-info { display: flex; gap: 8px; font-size: .88rem; margin: 5px 0; }
.ligne-info span:first-child { color: var(--doux); width: 78px; flex: none; }
.ligne-info span:last-child { font-weight: 700; }
.points { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; }
.points i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--prune); display: inline-block; }
.points i.p { background: var(--prune); }
.rangee5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.rangee5.minis { gap: 4px; width: 150px; }

/* ---------- échelle des combinaisons ---------- */
.echelle { display: grid; gap: 8px; }
.marche { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 18px; background: var(--blanc); box-shadow: var(--ombre); border: 1.5px solid #ecdbe4; width: 100%; text-align: left; }
.marche.actif { border-color: var(--prune); background: var(--lav-c); }
.marche .n { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: .85rem; }
.marche b { flex: 1; font: 700 .98rem var(--serif); }
.ouvert { margin: -2px 0 6px; padding: 14px; border-radius: 0 0 18px 18px; background: var(--blanc); border: 1.5px solid var(--prune); border-top: none; }
.ouvert .rangee5 { margin-bottom: 10px; }

/* ---------- tapis ---------- */
.tapis { border-radius: 26px; padding: 12px; background: var(--tapis-b); box-shadow: var(--ombre-f); margin: 10px 0; }
.tapis-in { border-radius: 20px; padding: 10px 10px 12px; background: radial-gradient(circle at 50% 30%, #7a5280, var(--tapis)); border: 1.5px solid var(--or); }
.tapis .lbl { color: #f3e4f0; font-size: .75rem; font-weight: 700; text-align: center; margin: 2px 0 6px; letter-spacing: .3px; }
.tapis .board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.tapis .mains { display: flex; justify-content: center; gap: 8px; margin-top: 10px; }
.tapis .mains .c { width: 19%; }
.vide { aspect-ratio: 100/140; border-radius: 9px; background: rgba(255,255,255,.08); border: 1.5px dashed rgba(255,255,255,.35); }
.pot { position: absolute; }

/* ---------- table de positions ---------- */
svg.table { display: block; width: 100%; height: auto; }
svg.table .siege { cursor: pointer; }

/* ---------- actions ---------- */
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.action { background: var(--blanc); border-radius: 18px; padding: 12px 10px; text-align: center; box-shadow: var(--ombre); border: 1px solid #e6d3de; }
.action .ico { width: 40px; height: 40px; border-radius: 50%; margin: 0 auto 6px; display: grid; place-items: center; font-size: 1.15rem; font-weight: 700; }
.action b { display: block; font: 700 1rem var(--serif); color: var(--prune); }
.action i { display: block; font-size: .78rem; color: var(--doux); }
.action p { font-size: .8rem; margin: 6px 0 0; line-height: 1.35; }
.frise { display: flex; gap: 5px; overflow-x: auto; padding: 4px 0 8px; scrollbar-width: none; }
.frise::-webkit-scrollbar { display: none; }
.frise .puce { flex: none; }

/* ---------- boutons ---------- */
.btn { display: block; width: 100%; padding: 13px 16px; border-radius: 30px; font-weight: 700; font-size: 1rem; text-align: center;
  background: var(--blanc); border: 1.5px solid var(--lavande); box-shadow: var(--ombre); }
.btn.principal { background: linear-gradient(135deg, var(--rose), var(--prune)); color: #fff; border-color: var(--prune); box-shadow: 0 4px 14px rgba(134,56,95,.35), 0 0 0 2px rgba(196,161,90,.45); }
.btn:active { transform: scale(.98); }
.deux-btn { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }

/* ---------- exercices ---------- */
.progres { text-align: center; color: var(--doux); font-size: .8rem; margin: 6px 0 2px; }
.dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; margin: 4px 0 6px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--lavande); background: #fff; }
.dots i.ok { background: var(--menthe); border-color: var(--vert); }
.dots i.ko { background: var(--rouge-c); border-color: var(--rouge); }
.dots i.cur { border-color: var(--prune); border-width: 2.5px; }
.question { font: 700 1.25rem var(--serif); color: var(--prune); text-align: center; margin: 8px 6px 4px; line-height: 1.3; }
.sous-q { text-align: center; color: var(--doux); font-size: .85rem; font-style: italic; margin-bottom: 6px; }
.situation { background: var(--blanc); border-radius: 22px; padding: 22px 18px; text-align: center; font-weight: 700; font-size: 1.05rem; line-height: 1.45; box-shadow: var(--ombre); margin: 10px 0; border: 1px solid #ecdbe4; }
.choix { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
.choix.une-col { grid-template-columns: 1fr; }
.choix button { padding: 12px 8px; border-radius: 16px; background: var(--blanc); border: 1.5px solid var(--lavande); font-weight: 700; font-size: .9rem; box-shadow: var(--ombre); }
.choix button:active { transform: scale(.97); }
.choix button.bon { background: var(--menthe); border-color: var(--vert); }
.choix button.faux { background: var(--rouge-c); border-color: var(--rouge); }
.choix button.eteint { color: #b6a8bb; box-shadow: none; }
.correction { border-radius: 20px; padding: 14px; text-align: center; font-weight: 700; line-height: 1.45; margin: 10px 0; animation: apparait .25s ease; }
.correction.bon { background: var(--menthe); } .correction.faux { background: var(--rouge-c); }
.correction small { display: block; font-weight: 500; margin-top: 6px; }
.correction .minis { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin-top: 8px; }
.correction .minis svg { width: 30px; }
@keyframes apparait { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.duel { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.duel .main { background: var(--blanc); border-radius: 18px; padding: 8px; box-shadow: var(--ombre); border: 2px solid transparent; text-align: center; }
.duel .main.bon { border-color: var(--vert); } .duel .main.faux { border-color: var(--rouge); }
.duel .main h5 { margin: 2px 0 6px; font: 700 .95rem var(--serif); color: var(--prune); }
.duel .main .cinq { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.duel .main .nom { font-weight: 700; font-size: .8rem; margin-top: 6px; }
.deux-grandes { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; padding: 8px 18px; }
.deux-grandes .ou { font: italic 1.1rem var(--serif); color: var(--doux); }
.cinq-cartes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 10px 0; }
.final { text-align: center; }
.final .score { font: 700 3.4rem var(--serif); color: var(--prune); margin: 6px 0; }
.final .msg { font-size: 1rem; margin-bottom: 14px; }

/* ---------- calculs ---------- */
table.tab { width: 100%; border-collapse: collapse; font-size: .82rem; }
.tab th { color: var(--prune); font-family: var(--serif); padding: 6px 4px; text-align: center; }
.tab td { padding: 7px 4px; text-align: center; }
.tab td:nth-child(2) { text-align: left; }
.tab tr:nth-child(even) td { background: var(--lav-c); }
.stepper { display: flex; align-items: center; justify-content: space-between; margin: 8px 0; }
.stepper span { font-weight: 700; font-size: .9rem; }
.stepper div { display: flex; align-items: center; gap: 10px; }
.stepper button { width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--lavande); background: #fff; font-size: 1.3rem; font-weight: 700; color: var(--prune); box-shadow: var(--ombre); }
.stepper output { min-width: 56px; text-align: center; font: 700 1.15rem var(--serif); color: var(--prune); }
.calc { background: var(--lav-c); border-radius: 16px; padding: 10px 14px; }
.calc div { font-weight: 700; margin: 6px 0; font-size: .92rem; }
.verdict { border-radius: 30px; padding: 12px; text-align: center; font-weight: 700; margin-top: 12px; font-size: 1.05rem; }
.verdict.bon { background: var(--menthe); border: 1.5px solid var(--vert); } .verdict.faux { background: var(--rouge-c); border: 1.5px solid var(--rouge); }
.outs-liste { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0; }
.outs-liste svg { width: 31px; }
.badge { flex: none; min-width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; }
.methode li { margin: 8px 0; }
.methode b { color: var(--prune); }

</style>
</head>
<body>
<div id="app"></div>
<script>
// ====================================================================
//  Apprendre le poker — logique du jeu et contenu des leçons
// ====================================================================
"use strict";

const ROUGE = "#b3264f", NOIR = "#2e2238";
const COULEURS = [["♥", "Cœur", ROUGE], ["♦", "Carreau", ROUGE], ["♣", "Trèfle", NOIR], ["♠", "Pique", NOIR]];

const VALEURS = [  // français, anglais, nom, article, remarque
  ["2", "2", "Deux", "le ", "La plus petite carte du jeu."],
  ["3", "3", "Trois", "le ", "Une carte basse."],
  ["4", "4", "Quatre", "le ", "Une carte basse."],
  ["5", "5", "Cinq", "le ", "Une carte basse, mais utile : elle termine la petite suite A-2-3-4-5."],
  ["6", "6", "Six", "le ", "Une carte moyenne."],
  ["7", "7", "Sept", "le ", "Une carte moyenne."],
  ["8", "8", "Huit", "le ", "Une carte moyenne."],
  ["9", "9", "Neuf", "le ", "La plus forte des cartes moyennes."],
  ["10", "T", "Dix", "le ", "Dans les logiciels et les ranges, le 10 s'écrit souvent « T » (pour Ten)."],
  ["V", "J", "Valet", "le ", "La première des figures. En anglais : Jack."],
  ["D", "Q", "Dame", "la ", "Une figure. En anglais : Queen."],
  ["R", "K", "Roi", "le ", "La plus forte des figures. En anglais : King."],
  ["A", "A", "As", "l'", "La carte la plus forte du jeu ! Il peut aussi compter comme un 1 dans la petite suite A-2-3-4-5."],
];
const PLURIELS = ["Deux", "Trois", "Quatre", "Cinq", "Six", "Sept", "Huit", "Neuf", "Dix", "Valets", "Dames", "Rois", "As"];
const FAMILLES = [[0, 3, "Cartes basses", "menthe"], [4, 7, "Cartes moyennes", "peche"], [8, 12, "Cartes hautes", "rose"]];

const COMBINAISONS = [
  { nom: "Carte haute", def: "Aucune combinaison : c'est la carte la plus haute qui compte.",
    astuce: "On dit « hauteur As », « hauteur Roi »… Si deux joueurs ont la même carte haute, on compare la suivante, et ainsi de suite.",
    ex: [[12, 3], [9, 0], [6, 2], [2, 1], [0, 0]] },
  { nom: "Paire", def: "Deux cartes de la même valeur.",
    astuce: "Si deux joueurs ont la même paire, ce sont les autres cartes (les « kickers ») qui départagent.",
    ex: [[12, 1], [12, 3], [7, 0], [4, 2], [1, 0]] },
  { nom: "Double paire", def: "Deux paires de valeurs différentes.",
    astuce: "Entre deux doubles paires, on compare d'abord la plus haute paire, puis la deuxième, puis la 5e carte.",
    ex: [[9, 0], [9, 3], [3, 1], [3, 2], [12, 2]] },
  { nom: "Brelan", def: "Trois cartes de la même valeur.",
    astuce: "Au Texas Hold'em, un brelan fait avec une paire en main s'appelle un « set ». Il est très bien caché !",
    ex: [[5, 0], [5, 2], [5, 3], [11, 1], [0, 2]] },
  { nom: "Quinte", def: "Cinq cartes qui se suivent, de couleurs mélangées. On dit aussi « suite ».",
    astuce: "L'As peut faire la petite quinte A-2-3-4-5 ou la grande 10-V-D-R-A, mais il ne « tourne » pas : R-A-2-3-4 n'est pas une quinte.",
    ex: [[4, 0], [5, 2], [6, 1], [7, 3], [8, 0]] },
  { nom: "Couleur", def: "Cinq cartes de la même couleur (♥, ♦, ♣ ou ♠), dans n'importe quel ordre.",
    astuce: "Piège classique : la couleur bat la quinte ! Entre deux couleurs, c'est la plus haute carte qui gagne.",
    ex: [[0, 1], [5, 1], [7, 1], [9, 1], [11, 1]] },
  { nom: "Full", def: "Un brelan + une paire.",
    astuce: "On dit « full aux Dames par les 4 ». Entre deux fulls, c'est le brelan le plus fort qui gagne.",
    ex: [[10, 0], [10, 2], [10, 3], [2, 1], [2, 3]] },
  { nom: "Carré", def: "Quatre cartes de la même valeur.",
    astuce: "Une main très rare : environ une fois toutes les 600 mains au Hold'em.",
    ex: [[7, 0], [7, 1], [7, 2], [7, 3], [11, 0]] },
  { nom: "Quinte flush", def: "Cinq cartes qui se suivent, toutes de la même couleur.",
    astuce: "C'est une quinte ET une couleur en même temps. Entre deux quintes flush, celle qui monte le plus haut gagne.",
    ex: [[3, 3], [4, 3], [5, 3], [6, 3], [7, 3]] },
  { nom: "Quinte flush royale", def: "10, Valet, Dame, Roi, As, tous de la même couleur.",

function evaluer(main) {
  const rangs = main.map(c => c[0]);

  const uniq = new Set(rangs);
  const u = [...uniq];

  const suite = uniq.size === 5 && (Math.max(...u) - Math.min(...u) === 4 || roue);
  if (suite && flush) return [8, 9, 10, 11, 12].every(x => uniq.has(x)) ? 9 : 8;
  const comptes = u.map(r => rangs.filter(x => x === r).length).sort((a, b) => b - a);
  if (comptes[0] === 4) return 7;
  if (comptes[0] === 3 && comptes[1] === 2) return 6;

function combinaisons5(n) {

}

  if (cat === 8 || cat === 4) {

function construireTirage(typ) {
  for (;;) {
    let main, board;
    if (typ === "couleur") {
      const s = rnd(4), rs = echantillon(intervalle(0, 13), 5);
      const c = [...rs.slice(0, 4).map(r => [r, s]), [rs[4], choix([0, 1, 2, 3].filter(x => x !== s))]];
      main = c.slice(0, 2); board = c.slice(2);
    } else if (["oesd", "gutshot", "combo"].includes(typ)) {
      const r = typ === "gutshot" ? rnd(9) : 1 + rnd(7);

      const c = melanger(rs.map(x => [x, typ === "combo" ? s : rnd(4)]));

    else if (cat !== 2 || outsDe(vis, 6).length !== n || outsDe(vis, 4).length !== n) continue;
    return [melanger(main), board, outsDe(vis, cible)];
  }
}

  return melanger(qs).map(q => ({ ...q, visuel: () => q.tapis ? tapisHTML(q.tapis[0], q.tapis[1], new Set(), "le board · " + q.tapis[2]) : `<div class="situation">${q.texte}</div>` }));
}
const SERIES = { "1exo": serie1, "2exo": serie2, "2bat": serieBat, "3exo": serie3, "4exo": serie4, "5exo": serie5, "6exo": serie6 };

function vueSerie(id) {
  let s = etat.series[id];
  if (!s) s = etat.series[id] = { qs: SERIES[id](), i: 0, res: [], rep: null };
  const total = s.qs.length, score = s.res.filter(Boolean).length;
  if (s.i >= total) return finalHTML(id, score, total);
  const q = s.qs[s.i], rep = s.rep;
  const dots = s.qs.map((_, k) => `<i class="${k < s.res.length ? (s.res[k] ? "ok" : "ko") : k === s.i ? "cur" : ""}"></i>`).join("");
  const compteur = q.compteurTxt || `${q.compteur || "Question"} ${s.i + 1} sur ${total}`;
  let h = `<div class="progres">${compteur} · ${score} bonne${score > 1 ? "s" : ""} réponse${score > 1 ? "s" : ""}</div><div class="dots">${dots}</div>
    <div class="question">${q.titre}</div>${q.sous ? `<div class="sous-q">${q.sous}</div>` : ""}${q.visuel(rep)}`;
  if (q.choix) h += `<div class="choix ${q.uneCol ? "une-col" : ""}">${q.choix.map(c => `<button data-rep="${c.v}" class="${rep === null ? "" : c.v === q.bonne ? "bon" : c.v === rep ? "faux" : "eteint"}">${c.l}</button>`).join("")}</div>`;
  if (rep !== null) {
    const ok = rep === q.bonne;
    h += `<div class="correction ${ok ? "bon" : "faux"}" id="correction">${ok ? "Bravo ! ✿ " : "Pas tout à fait… "}${q.expl}${q.apres || ""}</div>
      <button class="btn principal" data-action="suivant">${s.i + 1 >= total ? "Voir mon score ✿" : (q.suivant || "Suivante ▶")}</button>`;
  }
  return h;
}
function finalHTML(id, score, total) {
  const cle = "meilleur_" + id, avant = memoire.lire(cle, 0);
  if (score > avant) memoire.ecrire(cle, score);
  const t = score / total;
  const msg = t === 1 ? "Parfait ! Un sans-faute ♡" : t >= .8 ? "Très bien ! Encore une série pour viser le sans-faute ?" : t >= .5 ? "Pas mal ! Un petit tour par « Découvrir » et on recommence." : "Pas de souci, on révise dans « Découvrir » et on réessaie ♡";
  const n = +etat.route[1];
  return `<div class="bloc final"><h3>✿ Série terminée ✿</h3><div class="score">${score} / ${total}</div><div class="msg">${msg}</div>
    <p class="indice">Meilleur score : ${Math.max(score, avant)} / ${total}</p>
    <button class="btn principal" data-action="recommencer">↻ Recommencer</button>
    ${n < 6 ? `<button class="btn" style="margin-top:10px" data-nav="lecon/${n + 1}/dec">Leçon suivante : ${LECONS[n + 1].titre} ▶</button>` : ""}</div>${promoHTML()}`;
}

// ---------------------------------------------------------------- écrans
function etoiles(n) {
  const ids = Object.keys(SERIES).filter(k => k[0] === String(n));
  const t = ids.reduce((a, id) => a + memoire.lire("meilleur_" + id, 0) / (id === "2exo" ? 20 : id === "5exo" ? 24 : id === "3exo" || id === "4exo" || id === "6exo" ? 15 : 10), 0) / ids.length;
  const e = t >= .95 ? 3 : t >= .7 ? 2 : t > 0 ? 1 : 0;
  return e ? "★".repeat(e) + "☆".repeat(3 - e) : "";
}
function accueil() {
  return `<header class="barre"><h1>Apprendre le poker</h1><button class="rond" data-nav="apropos" aria-label="À propos">i</button></header><div class="filet"></div>
  <div class="hero"><div class="eventail">${carte(12, 3)}${carte(12, 0)}${carte(11, 1)}</div>
    <h2>Apprendre le poker</h2><p>Le Texas Hold'em pas à pas, leçon par leçon</p><div class="ornement">❦</div></div>
  <div class="lecons">${LECONS.slice(1).map((l, i) => `<button class="lecon" data-nav="lecon/${i + 1}/dec"><span class="num">${i + 1}</span><span class="txt"><b>${l.titre}</b><span>${l.desc}</span>${etoiles(i + 1) ? `<span class="etoiles">${etoiles(i + 1)}</span>` : ""}</span><span class="fleche">›</span></button>`).join("")}</div>
  ${promoHTML()}<p class="pied">Fait avec ♡ · <button data-nav="apropos">À propos et confidentialité</button></p>`;
}
function lecon(n, vue) {
  const L = LECONS[n];
  return `<header class="barre"><button class="rond" data-action="retour" aria-label="Retour">‹</button><h1>${n} · ${L.titre}</h1><a class="rond" href="${BOUTIQUE_URL}" target="_blank" rel="noopener" aria-label="Boutique">♡</a></header><div class="filet"></div>
  <nav class="onglets">${L.onglets.map(([v, t]) => `<button class="${v === vue ? "actif" : ""}" data-nav="lecon/${n}/${v}" data-remplace="1">${t}</button>`).join("")}</nav>
  <main class="contenu">${vue === "dec" ? DEC[n]() : vueSerie(n + vue)}</main>`;
}
function apropos() {
  return `<header class="barre"><button class="rond" data-action="retour" aria-label="Retour">‹</button><h1>À propos</h1></header><div class="filet"></div><main class="contenu">
  <div class="bloc"><h3>Apprendre le poker</h3><p>Une application pour découvrir le Texas Hold'em No Limit pas à pas : les cartes, les combinaisons, les positions, le déroulement d'une main, la lecture du board et les calculs de base, avec des exercices corrigés.</p>
  <p>Cette application est purement éducative : on n'y joue pas d'argent et elle ne propose aucun jeu d'argent.</p></div>
  <div class="bloc"><h3>Confidentialité</h3><p>L'application ne collecte, n'envoie et ne partage <b>aucune donnée personnelle</b>. Tes meilleurs scores et tes réglages sont seulement enregistrés sur ton téléphone. Il n'y a ni publicité, ni compte, ni traceur.</p></div>
  ${promoHTML()}</main>`;
}

function rendre() {
  const r = etat.route, app = document.getElementById("app");
  if (r[0] === "lecon") app.innerHTML = lecon(+r[1], r[2]);
  else if (r[0] === "apropos") app.innerHTML = apropos();
  else app.innerHTML = accueil();
}
function aller(chemin, remplacer) {
  etat.route = chemin.split("/");
  const st = { route: etat.route };
  if (remplacer) history.replaceState(st, "", "#" + chemin); else history.pushState(st, "", "#" + chemin);
  rendre(); window.scrollTo(0, 0);
}

// ---------------------------------------------------------------- interactions
const ACTES = {
  coul: k => d1.s = +k, nota: v => { etat.notation = v; memoire.ecrire("notation", v); }, carte: i => { d1.r = +i; setTimeout(() => document.getElementById("detail")?.scrollIntoView({ behavior: "smooth", block: "nearest" }), 30); },
  combo: c => d2.ouvert = d2.ouvert === +c ? -1 : +c,
  nbj: n => { d3.n = +n; d3.btn %= d3.n; d3.choisi = Math.min(d3.choisi, d3.n - 1); }, ordre: o => d3.ordre = o, siege: k => d3.choisi = +k, mainsuiv: () => d3.btn = (d3.btn + 1) % d3.n,
  etape: k => d4.e = +k,
  donne: () => { d5.donne = tirerDonne5(); d5.nb = 0; }, voir: () => d5.nb = d5.nb === 0 ? 3 : Math.min(5, d5.nb + 1),
  sec: k => d6.sec = +k, tir: k => d6.t = d6.t === +k ? -1 : +k,
  pas: (cle, sens) => { const [p, mi, ma] = { pot: [5, 5, 300], mise: [5, 5, 300], outs: [1, 1, 20] }[cle]; d6[cle] = Math.max(mi, Math.min(ma, d6[cle] + sens * p)); },
};
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-nav],[data-action],[data-act],[data-rep]");
  if (!el) return;
  if (el.dataset.nav) { aller(el.dataset.nav, !!el.dataset.remplace); return; }
  if (el.dataset.action === "retour") { if (history.state && history.length > 1 && etat.route[0] !== "accueil") history.back(); else aller("accueil", true); return; }
  const id = etat.route[0] === "lecon" ? etat.route[1] + etat.route[2] : null, s = id && etat.series[id];
  if (el.dataset.action === "suivant" && s) { s.i++; s.rep = null; rendre(); document.querySelector(".onglets")?.scrollIntoView(); window.scrollTo(0, 0); return; }
  if (el.dataset.action === "recommencer" && id) { delete etat.series[id]; rendre(); window.scrollTo(0, 0); return; }
  if (el.dataset.act) { const [nom, ...args] = el.dataset.act.split(":"); const y = window.scrollY; ACTES[nom](...args); rendre(); window.scrollTo(0, y); return; }
  if (el.dataset.rep !== undefined && s && s.rep === null && s.i < s.qs.length) {
    const q = s.qs[s.i]; s.rep = el.dataset.rep; s.res.push(s.rep === q.bonne);
    const y = window.scrollY; rendre(); window.scrollTo(0, y);
    document.getElementById("correction")?.scrollIntoView({ behavior: "smooth", block: "center" });
  }
});
window.addEventListener("popstate", ev => { etat.route = (ev.state && ev.state.route) || ["accueil"]; rendre(); window.scrollTo(0, 0); });

document.body.insertAdjacentHTML("afterbegin", defsSVG());
history.replaceState({ route: ["accueil"] }, "", "#accueil");
rendre();
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});

</script>
